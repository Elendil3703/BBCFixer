# BBC dataset: BBCFixer configuration (evidence-guided repair, Section 3.2.3).
# The instance_template is the BBCFixer prompt: a five-stage procedure (collect the
# symptoms, locate the upstream change, choose the adaptation point, implement, verify);
# an opening digest that carries the first divergence found by differential execution and
# the symptom-matched fragments of the sliced diff; the full evidence mounted read-only
# under /evidence; and a check against the repair contract before the agent declares
# completion.
# It inherits every budget, model and environment parameter from bbc-baseline.yaml and
# overrides only instance_template.
# Same template as bbc-our.yaml with one added line, right after the task statement,
# that repeats the ban on editing the dependency manifests and lockfiles (used with
# GLM-4.5-Air).

extends: bbc-baseline.yaml

agent:
  instance_template: |
    You are the maintainer of the {{lang}} project `{{proj}}`. The project's dependencies have been
    upgraded and **pinned** to a set of new versions; the key dependencies are {{key_deps}}
    (version identifier: {{mig_date}}).
    Under these pinned dependencies the project's tests currently fail.

    Your task: modify the **project source code** so that the tests pass again on these pinned
    dependency versions.
    Do not edit the dependency manifests or lockfiles (package.json, package-lock.json and the like); an edit fails the run. An old version number written in a manifest is not a problem to fix.

    ## Work through the following five stages (state the conclusion of each stage in one or two sentences; do not restate at length)

    Stage 1. Collect the symptoms. Run the tests (or read the error output captured below) and group
    the failures into independent symptoms. For each, note where the error is reported, its type, and
    the asserted values (what was expected, what was actually obtained).
    Note that the place where an error is reported is often not the place that needs to change.

    Stage 2. Locate the library change, in this order of priority:
    (1) Read the failing assertion first: on which property do the expected and the actual value differ
        (type, precision, str versus bytes, time zone, whether an exception is raised, None versus a
        value)? This almost always tells you "what changed".
    (2) Then read the "fragments matching the error keywords" in the opening digest. They are verbatim
        excerpts retrieved mechanically from the library's test changes and source diff. A rewritten
        library assertion states what the behavior was changed to (the new expected value); the source
        diff states why it changed.
    (3) If the opening digest gives a "first divergence" (★), it is the earliest call from the
        downstream code into the library whose return value changed, as measured by differential
        execution. Use it to confirm where the change enters the downstream project. It is a candidate
        clue: when it contradicts the assertion, the assertion wins. If the digest says that no
        return-value difference was observed on the boundary calls of the downstream project's own
        code, do not look for a first divergence under /evidence; there is none.
    (4) Only if the above is still not enough, read the test diff (which existing assertions the library
        rewrote, and into what) and the source diff under /evidence in detail.

    A note on wholesale upgrades of large foundational libraries (numpy, pandas, scipy, Django, werkzeug,
    requests and the like): such upgrades usually break a "rule", not a function that disappeared:
    type promotion (a float32 array combined with a float64 scalar now gives float64), strings read as
    bytes by default, a changed default time zone or default argument, a silent return that now raises,
    a value that is now returned as None. The fix almost always compensates explicitly at the place in
    the downstream project that produces the asserted value. Do not modify the library, and do not
    expect to find "a renamed function".

    The direction of the compensation (the easiest thing to get backwards; always check it against the
    assertion): the tests did not change, so **the expected value in the assertion is the old behavior**
    and **the actual value is the new behavior**. Your goal is to make the downstream project produce the
    expected value again, not to make the code "fit the new defaults better".
    For example: expected float32, actual float64: where the result is produced, explicitly cast the
    result, or the scalars and weights taking part in the computation, to **the dtype of the input**
    (float32), not to float64. Expected str, actual bytes: decode. Expected a value, actual an exception
    or None: handle the new form at the call site according to the old semantics (catch it and give the
    old result; on None follow the old default), **keeping the original control flow**, without
    introducing a new early return.
    Keep the change small: preferably compensate only on the one or two lines that produce the value or
    raise the exception; do not rewrite a whole function, do not delete and re-insert a block of more than
    ten lines, and do not write several debugging scripts in a row (two at most).

    Stage 3. Choose the adaptation point. What should be modified is the mechanism that produces the
    tested property, not a patch at the error site that masks the symptom. The library's new behavior
    cannot be changed; where the downstream project still needs the old output or behavior, re-implement
    it on the downstream side (convert the return value, rebuild the object, validate explicitly, and so on).
    Do not conclude that "the remaining failures are a problem of the tests and production code cannot fix
    them": judging accepts only the original tests, and blaming the tests means giving up.

    Stage 4. Implement the change. Modify production code only. Keep the change as small as possible and
    touch as few places as possible.

    Stage 5. Verify the behavior. Check that all failing tests now pass (run the full test command once at
    the end), that the change lies in the mechanism rather than at the symptom, and that no new behavior
    deviation was introduced. If the evidence directory contains `contract.md`, check only the items
    related to the failures of this task (in the contract of a large library most items are unrelated to
    this project; skip them, do not read through them one by one).

    ## Step economy (the number of steps is limited; spend them as follows)
    - After each change, rerun only the few failing test cases (for pytest `path::test_name` or a `-k`
      expression), not the full suite every time; run the full suite once for the final confirmation.
    - If three consecutive changes at the same place make no progress, stop and return to (1) and (2) of
      Stage 2 to re-analyse; do not keep piling patches on the same place.
    - Within about 60 steps you should have a first passing version, or have clearly switched direction.

    ## Environment
    - The project code is in `{{work_dir}}`. All your commands run inside the container, and the
      dependencies are already installed at the versions above.
    - Test command: `{{test_cmd}}`
    - Each command runs in a fresh sub-shell; `cd` and environment variables are not preserved.
      Write `cd {{work_dir}} && ...` or `VAR=value cmd` when you need them.

    ## Current test error (captured from one actual run)
    ```
    {{ init_error if init_error else "(No error was captured; run the test command yourself to see it.)" }}
    ```

    ## Library evidence computed for you
    {% if evidence_mounted -%}
    {% if evidence_digest -%}
    The most condensed fragments have been extracted and are placed here; there is no need to search the
    directory for them:

    ```
    {{ evidence_digest }}
    ```

    {% endif -%}
    The full evidence is in the read-only directory `/evidence`: four kinds of diff (interface, source,
    test, dependency declaration), the differential execution report, the repair contract and related files.

    How to use it: the evidence is reference material, not a mandatory step. When the error and the opening
    digest are enough to locate the problem, fix it first and use the evidence afterwards to check the
    direction; read the evidence in detail only when they are not enough.
    When you do, run `ls -R /evidence` first to see which files exist; if there is a `README.md` or an
    `adaptation-basis.md`, read its guide first, then the other files as needed. Do not `cat` a long
    evidence file whole (long output is truncated and you will not see the second half); read it in parts
    with `sed -n '1,120p' file`, or locate with `grep -n 'keyword' file` first and then read a few dozen
    lines around the match.
    If the evidence mentions script tools (slicing commands named *.sh), they do not exist in your
    container; ignore them and read the files themselves.
    The fragments in the opening digest are verbatim; rereading them in the directory gives no new information.
    **Do not spend many consecutive steps reading evidence**: after about 6 steps of reading without a
    conclusion, stop, make a first change based on what you have, narrow the problem down with the test
    results, and come back to the evidence later if needed.
    Use no more than about 10 evidence-reading commands in the whole task.
    {%- else -%}
    (No evidence was generated for this case; infer from the error output.)
    {%- endif %}

    ## Hard constraints (violating any of them fails the run)
    - The dependency versions must stay as they are: do not downgrade, do not pin an old version back, do
      not delete a dependency, do not work around it with a different library, and do not edit the version
      declarations in {{manifest_names}}.
    - Do not delete or skip tests, do not comment out code that fails, do not add skip / xfail markers, and
      do not weaken or edit assertions. When the run is judged, every change you made to a test file is
      discarded and the original tests are run again.
    - Do not hollow out production code, and do not mask symptoms by catching exceptions or similar means.
    - The adaptation must lie in the mechanism that produces the tested property.

    ## Research restrictions
    - Do not consult online resources of this project ({{proj}}) itself, including its repository,
      commits, branches, tags, pull requests, issues and release notes.
    - You may consult the official documentation, release notes and interface change notes of the
      third-party libraries it depends on (such as {{key_deps}}).

    ## Finishing
    When everything passes and Stage 5 is done, end the task with this command:
    `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
    It must be sent on its own, not together with other commands.
    <important>After sending it you cannot make any further changes.</important>

    ## Action format
    Every response must contain exactly one `bash` tool call. Common forms:

    - **Do not run `npm install`, `pip install` or any other install or uninstall command, and do not
      change {{manifest_names}} or a lockfile (package-lock.json and the like) in any way.** The
      dependencies are already installed. Judging checks the integrity of the dependency tree and of the
      manifests: such a change fails the run even if every test passes.
    - View specific lines: `nl -ba {{work_dir}}/example.py | sed -n '10,30p'`
    - Back a file up before editing it: `cp {{work_dir}}/example.py {{work_dir}}/example.py.orig`.
      If you break it, restore the backup immediately (`cp` it back); do not keep patching a broken file.
    - Always edit code by **line-numbered** replacement: confirm the line number with `nl -ba`, then
      `sed -i '42s/old/new/' {{work_dir}}/example.py`. For several consecutive lines, delete the line range
      and insert, or write a python script that replaces only the target fragment.
    - Overwriting a whole file (`cat <<'EOF' > file`) **is allowed only for files under 200 lines**. Never
      overwrite a large file: rewriting a long file from memory necessarily loses content and destroys the
      module. Check the length with `wc -l` first.
    - **Do not use global replacement without line numbers**, for example `sed -i 's/old/new/g'`. It changes
      every match in the file, including comments, strings and other identifiers that happen to contain the
      same characters, and easily leaves the file with a syntax error.
    - After every edit, look at the changed place with `nl -ba ... | sed -n` and confirm that you changed the
      intended line and nothing else. For a Python file also run
      `python -c "import ast; ast.parse(open('path').read())"`, for a JavaScript file `node --check path`,
      to check the syntax before continuing.
