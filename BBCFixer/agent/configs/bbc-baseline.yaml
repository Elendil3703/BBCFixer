# BBC dataset: baseline configuration (no upstream change evidence is injected).
# The baseline and BBCFixer configurations share the same agent framework and the same
# budget; the only difference is whether the instance_template of this file supplies
# upstream information.
# The action-format section forbids installing dependencies and editing the dependency
# manifests (same wording in every configuration): runs whose tests all passed have been
# judged failed because the manifest had been modified.

agent:
  system_template: |
    You are a software engineer working in a Linux container. You interact with the
    computer only through the `bash` tool.

    Every response must contain exactly one `bash` tool call. Briefly state your reasoning
    before the call. Do not answer in prose without a tool call.

  instance_template: |
    You are the maintainer of the {{lang}} project `{{proj}}`. The project's dependencies have been
    upgraded and **pinned** to a set of new versions; the key dependencies are {{key_deps}}
    (version identifier: {{mig_date}}).
    Under these pinned dependencies the project's tests currently fail.

    Your task: modify the **project source code** so that the tests pass again on these pinned
    dependency versions.

    ## Environment
    - The project code is in `{{work_dir}}`. All your commands run inside the container, and the
      dependencies are already installed at the versions above.
    - Test command: `{{test_cmd}}`
    - Each command runs in a fresh sub-shell; `cd` and environment variables are not preserved.
      Write `cd {{work_dir}} && ...` or `VAR=value cmd` when you need them.

    ## Hard constraints (violating any of them fails the run)
    - The dependency versions must stay as they are: do not downgrade, do not pin an old version
      back, do not delete a dependency, do not work around it with a different library, and do not
      edit the version declarations in {{manifest_names}}.
    - You must solve the incompatibility between the code and the new dependency itself. If an
      interface was moved, renamed, or changed its behavior, adapt the source code to the correct
      usage of the new version.
    - Do not delete or skip tests, do not comment out code that fails, do not add skip / xfail
      markers, and do not weaken or edit assertions. When the run is judged, every change you made
      to a test file is discarded and the original tests are run again.

    ## Research restrictions
    - Do not consult online resources of this project ({{proj}}) itself, including its repository,
      commits, branches, tags, pull requests, issues and release notes.
    - You may consult the official documentation, release notes and interface change notes of the
      third-party libraries it depends on (such as {{key_deps}}).

    ## Suggested workflow
    1. Run the test command first and look at how it fails.
    2. Read the relevant source and decide which piece of code does not match the behavior of the
       new dependency. Note that the place where the error is reported is not necessarily the place
       that needs to be changed.
    3. Modify the source code.
    4. Run the tests again to verify.
    5. Once everything passes, end the task with this command:
       `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
       It must be sent on its own, not together with other commands.
       <important>After sending it you cannot make any further changes.</important>

    ## Action format
    Every response must contain exactly one `bash` tool call. Common forms:

    - **Do not run `npm install`, `pip install` or any other install or uninstall command, and do
      not change {{manifest_names}} or a lockfile (package-lock.json and the like) in any way.** The
      dependencies are already installed. Judging checks the integrity of the dependency tree and of
      the manifests: such a change fails the run even if every test passes.
    - View specific lines: `nl -ba {{work_dir}}/example.py | sed -n '10,30p'`
    - Back a file up before editing it: `cp {{work_dir}}/example.py {{work_dir}}/example.py.orig`.
      If you break it, restore the backup immediately (`cp` it back); do not keep patching a broken
      file.
    - Always edit code by **line-numbered** replacement: confirm the line number with `nl -ba`, then
      `sed -i '42s/old/new/' {{work_dir}}/example.py`. For several consecutive lines, delete the line
      range and insert, or write a python script that replaces only the target fragment.
    - Overwriting a whole file (`cat <<'EOF' > file`) **is allowed only for files under 200 lines**.
      Never overwrite a large file: rewriting a long file from memory necessarily loses content and
      destroys the module. Check the length with `wc -l` first.
    - **Do not use global replacement without line numbers**, for example `sed -i 's/old/new/g'`. It
      changes every match in the file, including comments, strings and other identifiers that happen
      to contain the same characters, and easily leaves the file with a syntax error.
    - After every edit, look at the changed place with `nl -ba ... | sed -n` and confirm that you
      changed the intended line and nothing else. For a Python file also run
      `python -c "import ast; ast.parse(open('path').read())"`, for a JavaScript file
      `node --check path`, to check the syntax before continuing.
  step_limit: 100
  cost_limit: 4.0
  wall_time_limit_seconds: 1800

environment:
  cwd: /work
  timeout: 600
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
    PYTHONDONTWRITEBYTECODE: '1'
    PYTEST_ADDOPTS: '-p no:cacheprovider'

model:
  # Use the OpenRouter-specific model class rather than the default litellm class: the
  # latter estimates the price itself and under-reports it by 2x to 67x depending on the
  # provider, which would make the cost_limit budget gate meaningless. This class asks
  # the API for the real billing (usage.include), so cost_limit is enforced correctly.
  model_class: openrouter
  # OpenRouter occasionally returns an empty usage record (Usage {}). The default setting
  # raises a RuntimeError on the spot and kills the whole run (observed as early as step 3).
  # Tolerate it instead: that step is billed as 0 and the run continues; the real cost of a
  # batch does not rely on per-step billing, it is checked against the balance difference
  # reported by the credits endpoint.
  cost_tracking: ignore_errors
  model_kwargs:
    # If unset, the model's maximum output (65536) is reserved for every request and the
    # request is rejected outright when the balance is insufficient; each step here needs
    # only a short reasoning passage plus one command, so 4096 is more than enough.
    max_tokens: 4096
    # OpenRouter routes automatically among several upstream providers whose quantization
    # differs widely (the same model drifts between fp4 / fp8 / bf16, and the cost of a
    # single call differs by almost 10x). Pin a single provider and disable fallbacks,
    # otherwise every run effectively uses a different model.
    # Override with the environment variable OPENROUTER_PROVIDER, see run-mini.py.
    provider:
      order: ["Venice"]
      allow_fallbacks: false
  observation_template: |
    {% if output.exception_info -%}
    <exception>{{output.exception_info}}</exception>
    {% endif -%}
    <returncode>{{output.returncode}}</returncode>
    {% if output.output | length < 3000 -%}
    <output>
    {{ output.output -}}
    </output>
    {%- else -%}
    <warning>
    The output of your last command was too long.
    Please try a different command that produces less output.
    If you're looking at a file you can try use head, tail or sed to view a smaller number of lines selectively.
    If you're using grep or find and it produced too much output, you can use a more selective search pattern.
    If you really need to see something from the full command's output, you can redirect output to a file and then search in that file.
    </warning>
    {%- set elided_chars = output.output | length - 3000 -%}
    <output_head>
    {{ output.output[:1500] }}
    </output_head>
    <elided_chars>
    {{ elided_chars }} characters elided
    </elided_chars>
    <output_tail>
    {{ output.output[-1500:] }}
    </output_tail>
    {%- endif -%}
  format_error_template: |
    Format error:

    <error>
    {{error}}
    </error>

    Every response must contain exactly one `bash` tool call; found {{actions|length}}.
    If you want to end the task, call `bash` with `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT` alone.
